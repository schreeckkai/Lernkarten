<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Schreck Lernkarten-Trainer</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    body {
      background-color: #000000;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app-container {
      background-color: #0d1117;
      border-left: 5px solid #644533;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
      width: 100%;
      max-width: 850px;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .counter {
      font-size: 1rem;
      color: #8b949e;
      font-family: monospace;
    }
    .card-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      min-height: 240px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    .card-content {
      font-size: 1.4rem;
      line-height: 1.6;
      color: #e5e7eb;
      width: 100%;
    }
    .card-content.answer-mode {
      color: #00dfc8;
    }
    .cloze {
      background-color: #21262d;
      color: #00dfc8;
      padding: 2px 8px;
      border-radius: 4px;
      border-bottom: 2px solid #00dfc8;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
    }
    .option-btn {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      text-align: left;
      transition: all 0.2s;
    }
    .option-btn:hover {
      background: #30363d;
    }
    .option-btn.correct {
      background: #238636 !important;
      color: white;
      border-color: #238636;
    }
    .option-btn.wrong {
      background: #da3633 !important;
      color: white;
      border-color: #da3633;
    }
    .tf-row {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      width: 100%;
    }
    .tf-btn {
      flex: 1;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #30363d;
    }
    .tf-btn.true { background: #1f6feb; color: white; }
    .tf-btn.false { background: #8957e5; color: white; }
    .tf-btn.correct { background: #238636 !important; border-color: #238636; }
    .tf-btn.wrong { background: #da3633 !important; border-color: #da3633; }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      gap: 15px;
    }
    button.action-btn {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 14px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      flex: 1;
    }
    button.action-btn.primary {
      background: #238636;
      color: #ffffff;
      border: none;
    }
    button.action-btn:hover {
      opacity: 0.9;
    }
    .shuffle-container {
      text-align: center;
      margin-top: 20px;
    }
    button.shuffle-btn {
      background: transparent;
      border: none;
      color: #00dfc8;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <span id="card-counter" class="counter">Lade Deck...</span>
  </div>
  
  <div id="card-box" class="card-box">
    <div id="card-content" class="card-content">Lade Karten aus JSON...</div>
  </div>
  
  <div class="btn-row">
    <button class="action-btn" onclick="prevCard()">← Zurück</button> 
    <button id="main-action-btn" class="action-btn primary" onclick="handleMainAction()">Umdrehen</button>
    <button class="action-btn" onclick="nextCard()">Weiter →</button>
  </div>
  
  <div class="shuffle-container">
    <button class="shuffle-btn" onclick="shuffleCards()">Kartensatz mischen (Zufallsprinzip)</button>
  </div>
</div>

<script>
  // --------------------- Globale Variablen ---------------------
  let cards = [];
  let currentIndex = 0;
  let showingFront = true;

  // --------------------- Initialisierung ---------------------
  async function initApp() {
    const urlParams = new URLSearchParams(window.location.search);
    const deckName = urlParams.get('deck') || 'Q3.1';
    const jsonUrl = `https://schreeckkai.github.io/Lernkarten/${deckName}.json`;

    try {
      const response = await fetch(jsonUrl);
      if (!response.ok) throw new Error(`HTTP-Status ${response.status}`);
      cards = await response.json();

      if (!Array.isArray(cards) || cards.length === 0) {
        document.getElementById('card-content').innerText = "Keine Karten in der JSON-Datei gefunden.";
        document.getElementById('card-counter').innerText = "Fehler";
        return;
      }

      shuffleCards(); // zeigt sofort die erste Karte an
    } catch (e) {
      document.getElementById('card-content').innerText = `Fehler beim Laden von '${deckName}.json': ${e.message}`;
      document.getElementById('card-counter').innerText = "Fehler";
    }
  }

  // --------------------- Lückentext-Hilfe ---------------------
  function processText(text, isFront) {
    if (!text) return "";
    return text.replace(/\{\{c\d+::(.*?)\}\}/g, function(match, p1) {
      if (isFront) {
        return `<span class="cloze">[...]</span>`;
      } else {
        return `<span class="cloze">${p1}</span>`;
      }
    });
  }

  // --------------------- Kartenanzeige ---------------------
  function displayCard() {
    if (cards.length === 0) return;
    const card = cards[currentIndex];
    const contentDiv = document.getElementById('card-content');
    const counterDiv = document.getElementById('card-counter');
    const actionBtn = document.getElementById('main-action-btn');

    counterDiv.innerText = `Karte ${currentIndex + 1} / ${cards.length}`;

    if (!card.type || card.type === 'flashcard') {
      actionBtn.style.display = "block";
      actionBtn.innerText = showingFront ? "Umdrehen" : "Frage zeigen";
      if (showingFront) {
        contentDiv.innerHTML = processText(card.front, true);
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = processText(card.back, false);
        contentDiv.classList.add('answer-mode');
      }
    } 
    else if (card.type === 'multiple-choice') {
      actionBtn.style.display = "none";
      if (showingFront) {
        let html = `<div style="text-align: left; margin-bottom: 10px;">${card.front}</div><div class="options-container">`;
        card.options.forEach((opt, idx) => {
          html += `<button class="option-btn" onclick="checkMC(${idx})">${opt}</button>`;
        });
        html += `</div>`;
        contentDiv.innerHTML = html;
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = `<div style="color:#00dfc8; margin-bottom:15px; font-weight:bold;">Erklärung / Lösung:</div><div style="text-align: left;">${card.back}</div>`;
        contentDiv.classList.add('answer-mode');
      }
    }
    else if (card.type === 'true-false') {
      actionBtn.style.display = "none";
      if (showingFront) {
        let html = `<div style="text-align: left; margin-bottom: 15px;">${card.front}</div><div class="tf-row">` +
                   `<button class="tf-btn true" onclick="checkTF(true)">Wahr</button>` +
                   `<button class="tf-btn false" onclick="checkTF(false)">Falsch</button>` +
                   `</div>`;
        contentDiv.innerHTML = html;
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = `<div style="color:#00dfc8; margin-bottom:15px; font-weight:bold;">Auflösung:</div><div style="text-align: left;">${card.back}</div>`;
        contentDiv.classList.add('answer-mode');
      }
    } else {
      contentDiv.innerText = "Unbekannter Kartentyp: " + card.type;
    }

    // KaTeX nach dem Einfügen rendern
    if (window.renderMathInElement) {
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    }
  }

  // --------------------- Interaktionen ---------------------
  function checkMC(selectedIndex) {
    const card = cards[currentIndex];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === card.correct) {
        btn.classList.add('correct');
      } else if (idx === selectedIndex) {
        btn.classList.add('wrong');
      }
    });
    setTimeout(() => {
      showingFront = false;
      displayCard();
    }, 1600);
  }

  function checkTF(selectedAnswer) {
    const card = cards[currentIndex];
    const buttons = document.querySelectorAll('.tf-btn');
    buttons.forEach(btn => {
      btn.disabled = true;
      const isTrue = btn.classList.contains('true');
      const isFalse = btn.classList.contains('false');
      if ((isTrue && card.answer === true) || (isFalse && card.answer === false)) {
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
      }
    });
    setTimeout(() => {
      showingFront = false;
      displayCard();
    }, 1600);
  }

  function handleMainAction() {
    showingFront = !showingFront;
    displayCard();
  }

  function nextCard() {
    showingFront = true;
    currentIndex = (currentIndex + 1) % cards.length;
    displayCard();
  }

  function prevCard() {
    showingFront = true;
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    displayCard();
  }

  function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    currentIndex = 0;
    showingFront = true;
    displayCard();
  }

  // --------------------- Start der App ---------------------
  document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
