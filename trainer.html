<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Schreck Lernkarten-Trainer</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ===== Grundlegendes Layout ===== */
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .app-container {
      background-color: #161b22;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 850px;
      box-sizing: border-box;
    }

    /* ===== Kopfzeile ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .counter {
      font-size: 0.95rem;
      color: #8b949e;
      font-family: monospace;
    }
    .mode-select {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .mode-select:focus {
      outline: none;
      border-color: #58a6ff;
    }

    /* ===== Kartenbox ===== */
    .card-box {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      min-height: 240px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.2s ease;
    }
    .card-content {
      font-size: 1.4rem;
      line-height: 1.7;
      color: #e6edf3;
      width: 100%;
    }
    .card-content.answer-mode {
      color: #58a6ff;
    }

    /* ===== Lückentext ===== */
    .cloze {
      background-color: #21262d;
      color: #58a6ff;
      padding: 2px 10px;
      border-radius: 4px;
      border-bottom: 2px solid #58a6ff;
      font-weight: 600;
    }

    /* ===== Multiple-Choice ===== */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
    }
    .option-btn {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      text-align: left;
      transition: background 0.2s;
    }
    .option-btn:hover:not(:disabled) {
      background: #30363d;
    }
    .option-btn.correct {
      background: #238636 !important;
      border-color: #238636;
      color: #fff;
    }
    .option-btn.wrong {
      background: #da3633 !important;
      border-color: #da3633;
      color: #fff;
    }

    /* ===== True/False ===== */
    .tf-row {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      width: 100%;
    }
    .tf-btn {
      flex: 1;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      transition: background 0.2s;
    }
    .tf-btn:hover:not(:disabled) {
      background: #30363d;
    }
    .tf-btn.correct {
      background: #238636 !important;
      border-color: #238636;
      color: #fff;
    }
    .tf-btn.wrong {
      background: #da3633 !important;
      border-color: #da3633;
      color: #fff;
    }

    /* ===== Button-Reihen ===== */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      gap: 12px;
      flex-wrap: wrap;
    }
    button.action-btn {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      flex: 1;
      min-width: 90px;
      transition: background 0.2s;
    }
    button.action-btn:hover {
      background: #30363d;
    }
    button.action-btn.primary {
      background: #1f6feb;
      border: none;
      color: #fff;
    }
    button.action-btn.primary:hover {
      background: #388bfd;
    }
    button.action-btn.success {
      background: #238636;
      border: none;
      color: #fff;
    }
    button.action-btn.success:hover {
      background: #2ea043;
    }

    /* ===== Fortschritt & Mischen ===== */
    .progress-message {
      margin-top: 15px;
      padding: 14px 18px;
      background: #21262d;
      border-radius: 8px;
      border-left: 4px solid #1f6feb;
      color: #e6edf3;
      font-size: 1rem;
    }
    .shuffle-container {
      text-align: center;
      margin-top: 20px;
    }
    button.shuffle-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 0.95rem;
      text-decoration: underline;
      transition: color 0.2s;
    }
    button.shuffle-btn:hover {
      color: #e6edf3;
    }
    .hidden {
      display: none !important;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .app-container { padding: 16px; }
      .card-box { padding: 24px 16px; min-height: 180px; }
      .card-content { font-size: 1.1rem; }
      .btn-row button { font-size: 0.85rem; padding: 10px 14px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <span id="card-counter" class="counter">Lade Deck...</span>
    <select id="mode-select" class="mode-select" onchange="switchMode()">
      <option value="learn">Lernen (5er-Päckchen)</option>
      <option value="practice">Üben (alle Karten)</option>
    </select>
  </div>
  
  <div id="card-box" class="card-box">
    <div id="card-content" class="card-content">Lade Karten aus JSON...</div>
  </div>
  
  <div class="btn-row">
    <button class="action-btn" onclick="prevCard()">← Zurück</button> 
    <button id="main-action-btn" class="action-btn primary" onclick="handleMainAction()">Umdrehen</button>
    <button class="action-btn" onclick="nextCard()">Weiter →</button>
  </div>

  <div id="learn-controls" class="btn-row hidden">
    <button class="action-btn success" onclick="markBlockLearned()">✔ Block gelernt</button>
  </div>

  <div id="progress-area" class="progress-message hidden"></div>
  
  <div class="shuffle-container">
    <button class="shuffle-btn" onclick="shuffleCards()">Kartensatz mischen (Zufallsprinzip)</button>
  </div>
</div>

<script>
  // =========================== Globale Variablen ===========================
  let allCards = [];
  let currentIndex = 0;
  let showingFront = true;
  let mode = 'learn';
  let blockSize = 5;
  let currentBlockIndex = 0;
  let learnedCount = 0;
  let totalCards = 0;
  let blockStarted = false;

  // =========================== Initialisierung ===========================
  async function initApp() {
    const urlParams = new URLSearchParams(window.location.search);
    const deckParam = urlParams.get('deck') || 'Q3.1';
    const deckNames = deckParam.split(',').map(s => s.trim()).filter(s => s.length > 0);

    const basePath = window.location.pathname.replace(/\/[^/]*$/, '/');
    const baseUrl = window.location.origin + basePath;

    try {
      const fetchPromises = deckNames.map(name => {
        const cleanName = name.replace(/\.json$/, '');
        return fetch(`${baseUrl}${cleanName}.json`);
      });
      const responses = await Promise.all(fetchPromises);

      const failed = responses.map((r, idx) => ({ ok: r.ok, name: deckNames[idx] })).filter(f => !f.ok);
      if (failed.length > 0) {
        const names = failed.map(f => f.name).join(', ');
        throw new Error(`Folgende Dateien wurden nicht gefunden: ${names}`);
      }

      const jsonArrays = await Promise.all(responses.map(r => r.json()));
      allCards = jsonArrays.flat();

      if (allCards.length === 0) {
        document.getElementById('card-content').innerText = "Keine Karten gefunden.";
        document.getElementById('card-counter').innerText = "Fehler";
        return;
      }

      totalCards = allCards.length;
      shuffleCards();
      switchMode();
    } catch (e) {
      document.getElementById('card-content').innerText = `Fehler: ${e.message}`;
      document.getElementById('card-counter').innerText = "Fehler";
      console.error(e);
    }
  }

  // =========================== Lückentext ===========================
  function processText(text, isFront) {
    if (!text) return "";
    return text.replace(/\{\{c\d+::(.*?)\}\}/g, function(match, p1) {
      return isFront ? `<span class="cloze">[...]</span>` : `<span class="cloze">${p1}</span>`;
    });
  }

  // =========================== Kartenanzeige ===========================
  function displayCard() {
    if (allCards.length === 0) return;

    if (mode === 'learn') {
      const start = getBlockStart(currentBlockIndex);
      const end = getBlockEnd(currentBlockIndex);
      if (currentIndex < start || currentIndex >= end) currentIndex = start;
      if (start >= totalCards) { goToBlockStart(); return; }
    }

    const card = allCards[currentIndex];
    const contentDiv = document.getElementById('card-content');
    const counterDiv = document.getElementById('card-counter');
    const actionBtn = document.getElementById('main-action-btn');

    if (mode === 'learn') {
      const start = getBlockStart(currentBlockIndex);
      const end = getBlockEnd(currentBlockIndex);
      const pos = currentIndex - start + 1;
      counterDiv.innerText = `Block ${currentBlockIndex+1}: ${pos}/${end-start}  (${learnedCount}+${pos} von ${totalCards})`;
    } else {
      counterDiv.innerText = `${currentIndex+1} / ${allCards.length}`;
    }

    if (!card.type || card.type === 'flashcard') {
      actionBtn.style.display = "block";
      actionBtn.innerText = showingFront ? "Umdrehen" : "Frage zeigen";
      contentDiv.innerHTML = showingFront ? processText(card.front, true) : processText(card.back, false);
      contentDiv.classList.toggle('answer-mode', !showingFront);
    } 
    else if (card.type === 'multiple-choice') {
      actionBtn.style.display = "none";
      if (showingFront) {
        let html = `<div style="text-align:left;margin-bottom:12px;">${card.front}</div><div class="options-container">`;
        card.options.forEach((opt, idx) => {
          html += `<button class="option-btn" onclick="checkMC(${idx})">${opt}</button>`;
        });
        html += `</div>`;
        contentDiv.innerHTML = html;
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = `<div style="color:#58a6ff;margin-bottom:12px;font-weight:600;">Lösung:</div><div style="text-align:left;">${card.back}</div>`;
        contentDiv.classList.add('answer-mode');
      }
    }
    else if (card.type === 'true-false') {
      actionBtn.style.display = "none";
      if (showingFront) {
        contentDiv.innerHTML = `
          <div style="text-align:left;margin-bottom:15px;">${card.front}</div>
          <div class="tf-row">
            <button class="tf-btn" onclick="checkTF(true)">Wahr</button>
            <button class="tf-btn" onclick="checkTF(false)">Falsch</button>
          </div>
        `;
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = `<div style="color:#58a6ff;margin-bottom:12px;font-weight:600;">Auflösung:</div><div style="text-align:left;">${card.back}</div>`;
        contentDiv.classList.add('answer-mode');
      }
    } else {
      contentDiv.innerText = "Unbekannter Kartentyp: " + card.type;
    }

    if (window.renderMathInElement) {
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    }
  }

  // =========================== Lernmodus ===========================
  function getBlockStart(blockIdx) { return blockIdx * blockSize; }
  function getBlockEnd(blockIdx) { return Math.min((blockIdx + 1) * blockSize, totalCards); }

  function goToBlockStart() {
    if (mode !== 'learn') return;
    const start = getBlockStart(currentBlockIndex);
    if (start >= totalCards) {
      document.getElementById('card-content').innerHTML = `<div style="color:#58a6ff;font-size:1.8rem;">🎉 Alle Karten gelernt! 🎉</div>`;
      document.getElementById('card-counter').innerText = `Fertig! ${totalCards} Karten`;
      document.getElementById('main-action-btn').style.display = 'none';
      document.getElementById('learn-controls').classList.add('hidden');
      return;
    }
    currentIndex = start;
    showingFront = true;
    displayCard();
    updateProgressMessage();
  }

  function updateProgressMessage() {
    if (mode !== 'learn') return;
    const pa = document.getElementById('progress-area');
    const start = getBlockStart(currentBlockIndex);
    const end = getBlockEnd(currentBlockIndex);
    const totalBlocks = Math.ceil(totalCards / blockSize);
    pa.classList.remove('hidden');
    pa.innerHTML = `
      <strong>Fortschritt:</strong> ${learnedCount} von ${totalCards} Karten gelernt.
      <br><span style="color:#8b949e;">Block ${currentBlockIndex+1} von ${totalBlocks} (${end-start} Karten)</span>
    `;
  }

  function switchMode() {
    mode = document.getElementById('mode-select').value;
    const learnControls = document.getElementById('learn-controls');
    const pa = document.getElementById('progress-area');
    if (mode === 'learn') {
      learnControls.classList.remove('hidden');
      if (!blockStarted) { currentBlockIndex = 0; learnedCount = 0; blockStarted = true; }
      updateProgressMessage();
      goToBlockStart();
    } else {
      learnControls.classList.add('hidden');
      pa.classList.add('hidden');
      if (currentIndex >= allCards.length) currentIndex = 0;
      showingFront = true;
      displayCard();
    }
  }

  function markBlockLearned() {
    if (mode !== 'learn') return;
    const start = getBlockStart(currentBlockIndex);
    const end = getBlockEnd(currentBlockIndex);
    learnedCount += (end - start);
    currentBlockIndex++;
    if (learnedCount >= totalCards) {
      document.getElementById('card-content').innerHTML = `<div style="color:#58a6ff;font-size:1.8rem;">🎉 Alle ${totalCards} Karten gelernt! 🎉</div>`;
      document.getElementById('card-counter').innerText = 'Fertig!';
      document.getElementById('main-action-btn').style.display = 'none';
      document.getElementById('learn-controls').classList.add('hidden');
      document.getElementById('progress-area').classList.add('hidden');
      return;
    }
    const nextStart = getBlockStart(currentBlockIndex);
    const nextEnd = getBlockEnd(currentBlockIndex);
    const nextCount = nextEnd - nextStart;
    if (confirm(`✅ ${learnedCount} von ${totalCards} gelernt. Nächste ${nextCount} Karten lernen?`)) {
      goToBlockStart();
    } else {
      updateProgressMessage();
      alert('Du kannst später weitermachen.');
    }
  }

  // =========================== Interaktionen ===========================
  function checkMC(selectedIndex) {
    const card = allCards[currentIndex];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === card.correct) btn.classList.add('correct');
      else if (idx === selectedIndex) btn.classList.add('wrong');
    });
    setTimeout(() => { showingFront = false; displayCard(); }, 1500);
  }

  function checkTF(selectedAnswer) {
    const card = allCards[currentIndex];
    const buttons = document.querySelectorAll('.tf-btn');
    buttons.forEach(btn => {
      btn.disabled = true;
      const isTrue = btn.textContent.trim() === 'Wahr';
      if ((isTrue && card.answer) || (!isTrue && !card.answer)) btn.classList.add('correct');
      else btn.classList.add('wrong');
    });
    setTimeout(() => { showingFront = false; displayCard(); }, 1500);
  }

  function handleMainAction() { showingFront = !showingFront; displayCard(); }

  function nextCard() {
    if (allCards.length === 0) return;
    if (mode === 'learn') {
      const end = getBlockEnd(currentBlockIndex);
      if (currentIndex + 1 < end) { currentIndex++; }
      else { alert('Letzte Karte im Block – klicke "Block gelernt".'); return; }
    } else {
      currentIndex = (currentIndex + 1) % allCards.length;
    }
    showingFront = true;
    displayCard();
  }

  function prevCard() {
    if (allCards.length === 0) return;
    if (mode === 'learn') {
      const start = getBlockStart(currentBlockIndex);
      if (currentIndex - 1 >= start) { currentIndex--; }
      else { alert('Erste Karte im Block.'); return; }
    } else {
      currentIndex = (currentIndex - 1 + allCards.length) % allCards.length;
    }
    showingFront = true;
    displayCard();
  }

  function shuffleCards() {
    for (let i = allCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allCards[i], allCards[j]] = [allCards[j], allCards[i]];
    }
    currentIndex = 0;
    showingFront = true;
    if (mode === 'learn') { currentBlockIndex = 0; learnedCount = 0; blockStarted = true; }
    displayCard();
    if (mode === 'learn') updateProgressMessage();
  }

  document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
