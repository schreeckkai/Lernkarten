<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Schreck Lernkarten-Trainer</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ===== Grundlayout (wie gehabt) ===== */
    body {
      background-color: #000000;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app-container {
      background-color: #0d1117;
      border-left: 5px solid #644533;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
      width: 100%;
      max-width: 850px;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .counter {
      font-size: 1rem;
      color: #8b949e;
      font-family: monospace;
    }
    .mode-select {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .card-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      min-height: 240px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    .card-content {
      font-size: 1.4rem;
      line-height: 1.6;
      color: #e5e7eb;
      width: 100%;
    }
    .card-content.answer-mode {
      color: #00dfc8;
    }
    .cloze {
      background-color: #21262d;
      color: #00dfc8;
      padding: 2px 8px;
      border-radius: 4px;
      border-bottom: 2px solid #00dfc8;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
    }
    .option-btn {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      text-align: left;
      transition: all 0.2s;
    }
    .option-btn:hover {
      background: #30363d;
    }
    .option-btn.correct {
      background: #238636 !important;
      color: white;
      border-color: #238636;
    }
    .option-btn.wrong {
      background: #da3633 !important;
      color: white;
      border-color: #da3633;
    }
    .tf-row {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      width: 100%;
    }
    .tf-btn {
      flex: 1;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #30363d;
    }
    .tf-btn.true { background: #1f6feb; color: white; }
    .tf-btn.false { background: #8957e5; color: white; }
    .tf-btn.correct { background: #238636 !important; border-color: #238636; }
    .tf-btn.wrong { background: #da3633 !important; border-color: #da3633; }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      gap: 15px;
      flex-wrap: wrap;
    }
    button.action-btn {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 14px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      flex: 1;
      min-width: 100px;
    }
    button.action-btn.primary {
      background: #238636;
      color: #ffffff;
      border: none;
    }
    button.action-btn.success {
      background: #1f6feb;
      color: white;
      border: none;
    }
    button.action-btn:hover {
      opacity: 0.9;
    }
    .shuffle-container {
      text-align: center;
      margin-top: 20px;
    }
    button.shuffle-btn {
      background: transparent;
      border: none;
      color: #00dfc8;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: underline;
    }
    .progress-message {
      margin-top: 15px;
      padding: 12px;
      background: #21262d;
      border-radius: 6px;
      border-left: 4px solid #00dfc8;
      color: #e5e7eb;
      font-size: 1rem;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <span id="card-counter" class="counter">Lade Deck...</span>
    <select id="mode-select" class="mode-select" onchange="switchMode()">
      <option value="learn">Lernen (5er-Päckchen)</option>
      <option value="practice">Üben (alle Karten)</option>
    </select>
  </div>
  
  <div id="card-box" class="card-box">
    <div id="card-content" class="card-content">Lade Karten aus JSON...</div>
  </div>
  
  <div class="btn-row">
    <button class="action-btn" onclick="prevCard()">← Zurück</button> 
    <button id="main-action-btn" class="action-btn primary" onclick="handleMainAction()">Umdrehen</button>
    <button class="action-btn" onclick="nextCard()">Weiter →</button>
  </div>

  <!-- Zusätzliche Buttons für den Lernmodus -->
  <div id="learn-controls" class="btn-row hidden">
    <button class="action-btn success" onclick="markBlockLearned()">✔ Block gelernt</button>
  </div>

  <div id="progress-area" class="progress-message hidden"></div>
  
  <div class="shuffle-container">
    <button class="shuffle-btn" onclick="shuffleCards()">Kartensatz mischen (Zufallsprinzip)</button>
  </div>
</div>

<script>
  // =========================== Globale Variablen ===========================
  let allCards = [];           // alle geladenen Karten (aus allen Decks)
  let currentIndex = 0;        // Index in allCards
  let showingFront = true;
  let mode = 'learn';          // 'learn' oder 'practice'

  // Für den Lernmodus (5er-Blöcke)
  let blockSize = 5;
  let currentBlockIndex = 0;   // Index des ersten Blocks (0-basiert)
  let learnedCount = 0;        // Anzahl bereits gelernten Karten (alle vorherigen Blöcke)
  let totalCards = 0;
  let blockStarted = false;

  // =========================== Initialisierung ===========================
  async function initApp() {
    const urlParams = new URLSearchParams(window.location.search);
    const deckParam = urlParams.get('deck') || 'Q3.1';
    // Unterstützt kommagetrennte Decks, z.B. "Q3.1,Q4.2,Q5.1"
    const deckNames = deckParam.split(',').map(s => s.trim()).filter(s => s.length > 0);
    
    try {
      // Lade alle JSONs parallel
      const fetchPromises = deckNames.map(name => fetch(`https://schreeckkai.github.io/Lernkarten/${name}.json`));
      const responses = await Promise.all(fetchPromises);
      
      // Prüfe, ob alle erfolgreich waren
      const failed = responses.some(r => !r.ok);
      if (failed) {
        throw new Error(`Mindestens eine JSON-Datei konnte nicht geladen werden.`);
      }
      
      const jsonArrays = await Promise.all(responses.map(r => r.json()));
      allCards = jsonArrays.flat(); // alle Karten zu einem großen Array vereinen
      
      if (allCards.length === 0) {
        document.getElementById('card-content').innerText = "Keine Karten in den JSON-Dateien gefunden.";
        document.getElementById('card-counter').innerText = "Fehler";
        return;
      }
      
      totalCards = allCards.length;
      // Standardmäßig mischen wir das Deck
      shuffleCards();
      // Modus initial setzen
      switchMode();
    } catch (e) {
      document.getElementById('card-content').innerText = `Fehler beim Laden der Decks: ${e.message}`;
      document.getElementById('card-counter').innerText = "Fehler";
    }
  }

  // =========================== Modus-Umschaltung ===========================
  function switchMode() {
    const select = document.getElementById('mode-select');
    mode = select.value;
    const learnControls = document.getElementById('learn-controls');
    const progressArea = document.getElementById('progress-area');
    
    if (mode === 'learn') {
      learnControls.classList.remove('hidden');
      // Setze Block-Lern-Status zurück (wenn noch nicht gestartet)
      if (!blockStarted) {
        currentBlockIndex = 0;
        learnedCount = 0;
        blockStarted = true;
      }
      // Zeige Fortschritt
      updateProgressMessage();
      // Gehe zur ersten Karte des aktuellen Blocks
      goToBlockStart();
    } else {
      learnControls.classList.add('hidden');
      progressArea.classList.add('hidden');
      // Im Übungsmodus: zeige alle Karten, aktueller Index bleibt erhalten
      // aber wir stellen sicher, dass wir nicht außerhalb der Grenzen sind
      if (currentIndex >= allCards.length) currentIndex = 0;
      showingFront = true;
      displayCard();
    }
  }

  // =========================== Lernmodus-Hilfsfunktionen ===========================
  function getBlockStart(blockIdx) {
    return blockIdx * blockSize;
  }

  function getBlockEnd(blockIdx) {
    return Math.min((blockIdx + 1) * blockSize, totalCards);
  }

  function goToBlockStart() {
    if (mode !== 'learn') return;
    const start = getBlockStart(currentBlockIndex);
    if (start >= totalCards) {
      // Alle Blöcke gelernt
      document.getElementById('card-content').innerHTML = `<div style="color:#00dfc8; font-size:1.8rem;">🎉 Alle Karten gelernt! 🎉</div>`;
      document.getElementById('card-counter').innerText = `Fertig! ${totalCards} Karten gelernt.`;
      document.getElementById('main-action-btn').style.display = 'none';
      document.getElementById('learn-controls').classList.add('hidden');
      return;
    }
    currentIndex = start;
    showingFront = true;
    displayCard();
    updateProgressMessage();
  }

  function updateProgressMessage() {
    if (mode !== 'learn') return;
    const progressArea = document.getElementById('progress-area');
    const learned = learnedCount;
    const total = totalCards;
    const blockNum = currentBlockIndex + 1;
    const totalBlocks = Math.ceil(total / blockSize);
    // Zeige Anzahl der Karten im aktuellen Block
    const start = getBlockStart(currentBlockIndex);
    const end = getBlockEnd(currentBlockIndex);
    const cardsInBlock = end - start;
    progressArea.classList.remove('hidden');
    progressArea.innerHTML = `
      <strong>Fortschritt:</strong> ${learned} von ${total} Karten gelernt.
      <br>
      <span style="color:#8b949e;">Aktueller Block ${blockNum} von ${totalBlocks} (${cardsInBlock} Karten)</span>
    `;
  }

  function markBlockLearned() {
    if (mode !== 'learn') return;
    const start = getBlockStart(currentBlockIndex);
    const end = getBlockEnd(currentBlockIndex);
    const blockCardCount = end - start;
    learnedCount += blockCardCount;
    currentBlockIndex++;
    // Prüfen, ob alle Karten gelernt sind
    if (learnedCount >= totalCards) {
      document.getElementById('card-content').innerHTML = `<div style="color:#00dfc8; font-size:1.8rem;">🎉 Glückwunsch! Alle ${totalCards} Karten gelernt! 🎉</div>`;
      document.getElementById('card-counter').innerText = `Fertig!`;
      document.getElementById('main-action-btn').style.display = 'none';
      document.getElementById('learn-controls').classList.add('hidden');
      document.getElementById('progress-area').classList.add('hidden');
      return;
    }
    // Frage: nächsten Block lernen?
    const nextBlockNum = currentBlockIndex + 1;
    const nextStart = getBlockStart(currentBlockIndex);
    const nextEnd = getBlockEnd(currentBlockIndex);
    const nextCount = nextEnd - nextStart;
    if (confirm(`Du hast jetzt ${learnedCount} von ${totalCards} Karten gelernt. Möchtest du die nächsten ${nextCount} Karten (Block ${nextBlockNum}) lernen?`)) {
      goToBlockStart();
    } else {
      // Bleibe im aktuellen Block, aber zeige Fortschritt
      updateProgressMessage();
      // Deaktiviere "Block gelernt" Button kurzzeitig? Optional.
      alert('Du kannst später weitermachen. Klicke auf "Block gelernt", wenn du bereit bist.');
    }
  }

  // =========================== Kartenanzeige (angepasst) ===========================
  function displayCard() {
    if (allCards.length === 0) return;
    // Im Lernmodus: sicherstellen, dass currentIndex innerhalb des aktuellen Blocks liegt
    if (mode === 'learn') {
      const start = getBlockStart(currentBlockIndex);
      const end = getBlockEnd(currentBlockIndex);
      if (currentIndex < start || currentIndex >= end) {
        // Falls wir außerhalb sind, korrigieren
        currentIndex = start;
      }
      // Wenn alle Karten gelernt, zeigen wir die Glückwunschmeldung (wird in goToBlockStart behandelt)
      if (start >= totalCards) {
        goToBlockStart(); // ruft die Endmeldung auf
        return;
      }
    }

    const card = allCards[currentIndex];
    const contentDiv = document.getElementById('card-content');
    const counterDiv = document.getElementById('card-counter');
    const actionBtn = document.getElementById('main-action-btn');
    
    // Counter anpassen
    if (mode === 'learn') {
      const start = getBlockStart(currentBlockIndex);
      const end = getBlockEnd(currentBlockIndex);
      const posInBlock = currentIndex - start + 1;
      counterDiv.innerText = `Block ${currentBlockIndex+1}: Karte ${posInBlock} von ${end-start}  (${learnedCount}+${posInBlock} von ${totalCards})`;
    } else {
      counterDiv.innerText = `Karte ${currentIndex + 1} / ${allCards.length}`;
    }

    // Kartentypen behandeln (wie gehabt, aber mit Block-Logik)
    if (!card.type || card.type === 'flashcard') {
      actionBtn.style.display = "block";
      actionBtn.innerText = showingFront ? "Umdrehen" : "Frage zeigen";
      if (showingFront) {
        contentDiv.innerHTML = processText(card.front, true);
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = processText(card.back, false);
        contentDiv.classList.add('answer-mode');
      }
    } 
    else if (card.type === 'multiple-choice') {
      actionBtn.style.display = "none";
      if (showingFront) {
        let html = `<div style="text-align: left; margin-bottom: 10px;">${card.front}</div><div class="options-container">`;
        card.options.forEach((opt, idx) => {
          html += `<button class="option-btn" onclick="checkMC(${idx})">${opt}</button>`;
        });
        html += `</div>`;
        contentDiv.innerHTML = html;
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = `<div style="color:#00dfc8; margin-bottom:15px; font-weight:bold;">Erklärung / Lösung:</div><div style="text-align: left;">${card.back}</div>`;
        contentDiv.classList.add('answer-mode');
      }
    }
    else if (card.type === 'true-false') {
      actionBtn.style.display = "none";
      if (showingFront) {
        let html = `<div style="text-align: left; margin-bottom: 15px;">${card.front}</div><div class="tf-row">` +
                   `<button class="tf-btn true" onclick="checkTF(true)">Wahr</button>` +
                   `<button class="tf-btn false" onclick="checkTF(false)">Falsch</button>` +
                   `</div>`;
        contentDiv.innerHTML = html;
        contentDiv.classList.remove('answer-mode');
      } else {
        contentDiv.innerHTML = `<div style="color:#00dfc8; margin-bottom:15px; font-weight:bold;">Auflösung:</div><div style="text-align: left;">${card.back}</div>`;
        contentDiv.classList.add('answer-mode');
      }
    } else {
      contentDiv.innerText = "Unbekannter Kartentyp: " + card.type;
    }

    // KaTeX rendern
    if (window.renderMathInElement) {
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    }
  }

  // =========================== Interaktionen (angepasst) ===========================
  function checkMC(selectedIndex) {
    const card = allCards[currentIndex];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === card.correct) {
        btn.classList.add('correct');
      } else if (idx === selectedIndex) {
        btn.classList.add('wrong');
      }
    });
    setTimeout(() => {
      showingFront = false;
      displayCard();
    }, 1600);
  }

  function checkTF(selectedAnswer) {
    const card = allCards[currentIndex];
    const buttons = document.querySelectorAll('.tf-btn');
    buttons.forEach(btn => {
      btn.disabled = true;
      const isTrue = btn.classList.contains('true');
      const isFalse = btn.classList.contains('false');
      if ((isTrue && card.answer === true) || (isFalse && card.answer === false)) {
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
      }
    });
    setTimeout(() => {
      showingFront = false;
      displayCard();
    }, 1600);
  }

  function handleMainAction() {
    showingFront = !showingFront;
    displayCard();
  }

  // Navigation: Im Lernmodus nur innerhalb des aktuellen Blocks
  function nextCard() {
    if (allCards.length === 0) return;
    if (mode === 'learn') {
      const end = getBlockEnd(currentBlockIndex);
      if (currentIndex + 1 < end) {
        currentIndex++;
      } else {
        // Am Ende des Blocks -> nichts tun oder Hinweis?
        alert('Das war die letzte Karte dieses Blocks. Klicke auf "Block gelernt", wenn du alle kannst.');
        return;
      }
    } else {
      currentIndex = (currentIndex + 1) % allCards.length;
    }
    showingFront = true;
    displayCard();
  }

  function prevCard() {
    if (allCards.length === 0) return;
    if (mode === 'learn') {
      const start = getBlockStart(currentBlockIndex);
      if (currentIndex - 1 >= start) {
        currentIndex--;
      } else {
        alert('Dies ist die erste Karte des Blocks.');
        return;
      }
    } else {
      currentIndex = (currentIndex - 1 + allCards.length) % allCards.length;
    }
    showingFront = true;
    displayCard();
  }

  function shuffleCards() {
    for (let i = allCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allCards[i], allCards[j]] = [allCards[j], allCards[i]];
    }
    currentIndex = 0;
    showingFront = true;
    // Wenn im Lernmodus, setze Blöcke zurück
    if (mode === 'learn') {
      currentBlockIndex = 0;
      learnedCount = 0;
      blockStarted = true;
    }
    displayCard();
    if (mode === 'learn') updateProgressMessage();
  }

  // =========================== Start ===========================
  document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
