<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernkarten-Trainer</title>

  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    body {
      background-color: #0d1117;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
    }
    .app-container {
      background-color: #0d1117;
      border-left: 5px solid #644533;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
      width: 100%; max-width: 800px; box-sizing: border-box;
    }
    h3 { margin-top: 0; font-size: 1.4rem; display: flex; align-items: center; justify-content: space-between; }
    .brand-title {
      font-family: 'Creepster', cursive, Georgia;
      color: #644533; font-size: 1.8rem; letter-spacing: 1px;
    }
    .counter { font-size: 0.9rem; color: #8b949e; font-family: monospace; }
    .card-box {
      background-color: #161b22; border: 1px solid #30363d;
      border-radius: 8px; min-height: 320px; padding: 30px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); box-sizing: border-box;
    }
    .card-content {
      font-size: 1.15rem; line-height: 1.6; color: #e5e7eb; width: 100%;
    }
    .card-content b { color: #00dfc8; }
    .btn-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 20px; gap: 10px;
    }
    button.action-btn {
      background: #21262d; color: #e5e7eb; border: 1px solid #30363d;
      padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-weight: bold; flex: 1;
    }
    button.action-btn.primary { background: #238636; color: #fff; border: none; }
    button.action-btn:hover { opacity: 0.9; }
    button.action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .shuffle-container { text-align: center; margin-top: 15px; }
    button.shuffle-btn {
      background: transparent; border: none; color: #00dfc8;
      cursor: pointer; font-size: 0.9rem; text-decoration: underline;
    }
    .cloze {
      background: #644533; color: transparent;
      padding: 2px 10px; border-radius: 4px;
      cursor: pointer; transition: all 0.2s;
      user-select: none; display: inline-block;
      min-width: 40px; text-align: center;
    }
    .cloze::before { content: "?"; color: #e5e7eb; font-weight: bold; }
    .cloze.revealed {
      background: rgba(0, 223, 200, 0.20); color: #00dfc8;
      font-weight: bold; user-select: auto;
    }
    .cloze.revealed::before { content: ""; }
    .block-finished { text-align: center; padding: 20px 10px; }
    .block-finished h2 { color: #22c55e; font-size: 1.8rem; margin-bottom: 10px; }
    .block-finished p { color: #8b949e; margin-bottom: 20px; }
    .block-finished button {
      background: #238636; color: #fff; border: none;
      padding: 14px 28px; border-radius: 8px; cursor: pointer;
      font-weight: bold; font-size: 1.1rem; margin: 0 6px 10px 6px;
    }
    .block-finished button.secondary {
      background: #21262d; color: #e5e7eb; border: 1px solid #30363d;
    }
    .progress-footer {
      margin-top: 15px; padding: 12px 16px;
      background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; font-size: 0.9rem;
      color: #8b949e; text-align: center;
    }
    .progress-footer strong { color: #00dfc8; }
    .error-box {
      background: rgba(239,68,68,0.15); border: 1px solid #ef4444;
      color: #fca5a5; padding: 16px; border-radius: 8px;
      margin: 10px 0; font-family: monospace; font-size: 0.9rem;
    }
    .cube-scene {
      perspective: 700px;
      width: 180px; height: 180px;
      margin: 20px auto;
      cursor: grab; touch-action: none; user-select: none;
    }
    .cube-scene:active { cursor: grabbing; }
    .cube-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.05s linear;
    }
    .cube-face {
      position: absolute;
      width: 180px; height: 180px;
      border: 2px solid #00dfc8;
      background: rgba(0, 223, 200, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; color: #00dfc8; font-weight: bold;
      box-shadow: inset 0 0 30px rgba(0, 223, 200, 0.2);
    }
    .cube-hint { text-align: center; color: #8b949e; font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

<div class="app-container">
  <h3>
    <span class="brand-title">Lernkarten-Trainer</span>
    <span id="card-counter" class="counter">Lade...</span>
  </h3>

  <div id="card-box" class="card-box" onclick="flipCard()">
    <div id="card-content" class="card-content">Lade Karten...</div>
  </div>

  <div class="btn-row">
    <button id="btn-prev" class="action-btn" onclick="prevCard()">← Zurück</button>
    <button id="btn-flip" class="action-btn primary" onclick="flipCard()">Umdrehen</button>
    <button id="btn-next" class="action-btn" onclick="nextCard()">Weiter →</button>
  </div>

  <div class="shuffle-container">
    <button class="shuffle-btn" onclick="shuffleCards()">Aktuellen Block neu mischen</button>
  </div>

  <div id="progress-footer" class="progress-footer" style="display:none;"></div>
</div>

<script>
  // ==================================================
  // 1) KARTEN LADEN
  // ==================================================
  const BLOCK_SIZE = 5;
  let allCards = [];
  let blockIndex = 0;
  let deck = [];
  let currentIndex = 0;
  let showingFront = true;
  let blockFinished = false;

  function loadCardsFromURL() {
    const params = new URLSearchParams(window.location.search);
    const deckName = params.get('deck');

    if (!deckName) {
      return Promise.resolve([
        { front: "Was ist die Untersumme \\(U_n\\)?",
          back: "Eine Näherung für den Flächeninhalt unter einem Graphen." }
      ]);
    }

    const url = deckName + '.json';
    console.log('Lade Karten von:', url);

    return fetch(url)
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' beim Laden von ' + url);
        return r.text();
      })
      .then(text => {
        try { return JSON.parse(text); }
        catch(e) { throw new Error('JSON-Fehler in ' + url + ': ' + e.message); }
      });
  }

  // ==================================================
  // 2) RENDERING (Cloze + Math)
  // ==================================================
  function renderCloze(html) {
    if (typeof html !== 'string') return '';
    return html.replace(/\{\{c\d+::([^}:]+?)(?:::([^}]+?))?\}\}/g,
      (match, solution) =>
        `<span class="cloze" onclick="event.stopPropagation(); this.classList.toggle('revealed');">${solution}</span>`);
  }

  function renderClozeRevealed(html) {
    if (typeof html !== 'string') return '';
    return html.replace(/\{\{c\d+::([^}:]+?)(?:::([^}]+?))?\}\}/g,
      (match, solution) => `<span class="cloze revealed">${solution}</span>`);
  }

  function renderMath() {
    if (window.renderMathInElement) {
      try {
        renderMathInElement(document.getElementById('card-content'), {
          delimiters: [
            {left: "\\(", right: "\\)", display: false},
            {left: "\\[", right: "\\]", display: true}
          ],
          throwOnError: false
        });
      } catch(e) { console.warn('KaTeX:', e); }
    }
  }

  // ==================================================
  // 3) BLOCK-VERWALTUNG
  // ==================================================
  function totalBlocks() {
    return Math.ceil(allCards.length / BLOCK_SIZE);
  }

  function loadBlock(index) {
    blockIndex = index;
    const start = index * BLOCK_SIZE;
    const end = Math.min(start + BLOCK_SIZE, allCards.length);
    deck = allCards.slice(start, end);

    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    currentIndex = 0;
    showingFront = true;
    blockFinished = false;
    updateProgressFooter();
    displayCard();
  }

  function updateProgressFooter() {
    const footer = document.getElementById('progress-footer');
    if (allCards.length === 0) { footer.style.display = 'none'; return; }
    footer.style.display = 'block';
    const totalB = totalBlocks();
    const learnedCards = blockIndex * BLOCK_SIZE + Math.min(currentIndex + (showingFront ? 0 : 1), deck.length);
    footer.innerHTML = `<strong>Block ${blockIndex + 1} von ${totalB}</strong> &nbsp;•&nbsp; ${deck.length} Karten in diesem Block &nbsp;•&nbsp; ${learnedCards} von ${allCards.length} Karten bearbeitet`;
  }

  // ==================================================
  // 4) ANZEIGE-LOGIK
  // ==================================================
  function displayCard() {
    const contentDiv = document.getElementById('card-content');
    const counterDiv = document.getElementById('card-counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnFlip = document.getElementById('btn-flip');
    const btnNext = document.getElementById('btn-next');

    if (blockFinished) {
      counterDiv.innerText = `Block ${blockIndex + 1} / ${totalBlocks()}`;
      const isLast = (blockIndex + 1) >= totalBlocks();
      contentDiv.innerHTML = `
        <div class="block-finished">
          <h2>✓ Block ${blockIndex + 1} geschafft!</h2>
          <p>Du hast ${deck.length} Karten bearbeitet. Kurze Pause – dann geht's weiter.</p>
          ${isLast
            ? `<p style="color:#22c55e; font-weight:bold;">🎉 Das war der letzte Block. Super gemacht!</p>
               <button class="secondary" onclick="restartDeck()">Von vorne beginnen</button>`
            : `<button onclick="nextBlock()">Nächster Block →</button>
               <button class="secondary" onclick="repeatBlock()">Diesen Block wiederholen</button>`}
        </div>`;
      btnPrev.disabled = true;
      btnFlip.disabled = true;
      btnNext.disabled = true;
      return;
    }

    const card = deck[currentIndex];
    if (!card) { contentDiv.innerHTML = '<div class="error-box">Keine Karte gefunden.</div>'; return; }

    if (showingFront) {
      contentDiv.innerHTML = renderCloze(card.front || '');
    } else {
      contentDiv.innerHTML = renderClozeRevealed(card.back || '');
    }

    counterDiv.innerText = `Karte ${currentIndex + 1} / ${deck.length}  •  Block ${blockIndex + 1} / ${totalBlocks()}`;
    btnPrev.disabled = false;
    btnFlip.disabled = false;
    btnNext.disabled = false;

    setTimeout(renderMath, 50);
    setTimeout(initAllDynamic, 80);
  }

  // ==================================================
  // 5) NAVIGATION
  // ==================================================
  function flipCard() {
    if (blockFinished) return;
    showingFront = !showingFront;
    displayCard();
    updateProgressFooter();
  }

  function nextCard() {
    if (blockFinished) return;
    showingFront = true;
    if (currentIndex < deck.length - 1) {
      currentIndex++;
      displayCard();
      updateProgressFooter();
    } else {
      finishBlock();
    }
  }

  function prevCard() {
    if (blockFinished) return;
    showingFront = true;
    if (currentIndex > 0) {
      currentIndex--;
      displayCard();
      updateProgressFooter();
    }
  }

  function finishBlock() {
    blockFinished = true;
    showingFront = false;
    displayCard();
    updateProgressFooter();
  }

  function nextBlock() {
    if (blockIndex + 1 < totalBlocks()) loadBlock(blockIndex + 1);
  }
  function repeatBlock() { loadBlock(blockIndex); }
  function restartDeck() { loadBlock(0); }

  function shuffleCards() {
    if (blockFinished) return;
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    currentIndex = 0;
    showingFront = true;
    displayCard();
    updateProgressFooter();
  }

  // ==================================================
  // 6) HILFSFUNKTIONEN FÜR DYNAMISCHE LERNKARTEN
  // ==================================================
  function parseFunc(funcStr) {
    if (typeof funcStr !== 'string') return () => 0;
    try {
      const node = Function('x', 'return ' + funcStr);
      node(0);
      return node;
    } catch (e) {
      console.warn('Parser-Fehler:', funcStr, e);
      return () => 0;
    }
  }

  function riemann(canvasId, a, b, n, type, funcStr) {
    const svg = document.getElementById(canvasId);
    if (!svg) return;
    const func = svg.dataset.func || funcStr || "x";
    const f = parseFunc(func);
    const W = 360, H = 180, pad = 30;
    const scaleX = (W - 2 * pad) / (b - a);

    let maxY = 0.01, minY = 0;
    for (let i = 0; i <= 200; i++) {
      const y = f(a + (b - a) * i / 200);
      if (y > maxY) maxY = y;
      if (y < minY) minY = y;
    }
    const yRange = maxY - minY;
    if (yRange <= 0) return;
    const scaleY = (H - 2 * pad) / yRange;
    const zeroY = pad + maxY * scaleY;

    let html = "";
    html += `<line x1="${pad}" y1="${zeroY}" x2="${W - pad}" y2="${zeroY}" stroke="#8b949e" stroke-width="1.5"/>`;
    html += `<line x1="${pad}" y1="${pad / 2}" x2="${pad}" y2="${H - pad}" stroke="#8b949e" stroke-width="1.5"/>`;

    const dx = (b - a) / n;
    for (let i = 0; i < n; i++) {
      const x0 = a + i * dx;
      const samples = [];
      for (let k = 0; k <= 10; k++) samples.push(f(x0 + k * dx / 10));
      const h = (type === "U") ? Math.min(...samples) : Math.max(...samples);
      const px = pad + (x0 - a) * scaleX;
      const pw = dx * scaleX;
      const py = zeroY - h * scaleY;
      const rectY = Math.min(zeroY, py);
      const rectH = Math.abs(zeroY - py);
      const fillColor = type === "U" ? "rgba(34,197,94,0.35)" : "rgba(239,68,68,0.30)";
      const strokeColor = type === "U" ? "#22c55e" : "#ef4444";
      html += `<rect x="${px}" y="${rectY}" width="${pw}" height="${rectH}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="1"/>`;
    }

    let pts = "";
    for (let i = 0; i <= 100; i++) {
      const x = a + (b - a) * i / 100;
      pts += `${pad + (x - a) * scaleX},${zeroY - f(x) * scaleY} `;
    }
    html += `<polyline points="${pts.trim()}" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>`;

    svg.innerHTML = html;

    const infoId = svg.dataset.info;
    if (infoId) {
      const el = document.getElementById(infoId);
      if (el) el.textContent = n;
    }
  }

  function movePoint(svgId, xVal, funcStr, infoId) {
    const svg = document.getElementById(svgId);
    if (!svg) return;
    const func = svg.dataset.func || funcStr || "x";
    const f = parseFunc(func);
    const a = parseFloat(svg.dataset.a || 0);
    const b = parseFloat(svg.dataset.b || 6);
    const W = 360, H = 180, pad = 30;
    const scaleX = (W - 2 * pad) / (b - a);

    let maxY = 0.01, minY = 0;
    for (let i = 0; i <= 100; i++) {
      const y = f(a + (b - a) * i / 100);
      if (y > maxY) maxY = y;
      if (y < minY) minY = y;
    }
    const yRange = maxY - minY;
    if (yRange <= 0) return;
    const scaleY = (H - 2 * pad) / yRange;
    const zeroY = pad + maxY * scaleY;

    let html = "";
    html += `<line x1="${pad}" y1="${zeroY}" x2="${W - pad}" y2="${zeroY}" stroke="#8b949e" stroke-width="1.5"/>`;
    html += `<line x1="${pad}" y1="${pad / 2}" x2="${pad}" y2="${H - pad}" stroke="#8b949e" stroke-width="1.5"/>`;

    let areaPts = `${pad},${zeroY} `;
    for (let i = 0; i <= 60; i++) {
      const x = a + (xVal - a) * i / 60;
      areaPts += `${pad + (x - a) * scaleX},${zeroY - f(x) * scaleY} `;
    }
    areaPts += `${pad + (xVal - a) * scaleX},${zeroY}`;
    html += `<polygon points="${areaPts}" fill="rgba(0,223,200,0.20)" stroke="none"/>`;

    let pts = "";
    for (let i = 0; i <= 100; i++) {
      const x = a + (b - a) * i / 100;
      pts += `${pad + (x - a) * scaleX},${zeroY - f(x) * scaleY} `;
    }
    html += `<polyline points="${pts.trim()}" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>`;

    const px = pad + (xVal - a) * scaleX;
    const py = zeroY - f(xVal) * scaleY;
    html += `<line x1="${px}" y1="${zeroY}" x2="${px}" y2="${py}" stroke="#00dfc8" stroke-width="1.5" stroke-dasharray="3,3"/>`;
    html += `<circle cx="${px}" cy="${py}" r="6" fill="#00dfc8" stroke="#0d1117" stroke-width="2"/>`;

    svg.innerHTML = html;

    const el = document.getElementById(infoId);
    if (el) el.innerHTML = `x = ${xVal.toFixed(2)} &nbsp;|&nbsp; f(x) = ${f(xVal).toFixed(2)}`;
  }

  function checkNum(inputId, correct, tol, feedbackId) {
    const input = document.getElementById(inputId);
    const fb = document.getElementById(feedbackId);
    if (!input || !fb) return;
    const val = parseFloat(input.value.replace(",", "."));
    if (isNaN(val)) {
      fb.innerHTML = "❌ Bitte gib eine Zahl ein.";
      fb.style.color = "#ef4444";
      return;
    }
    if (Math.abs(val - correct) <= tol) {
      fb.innerHTML = "✅ Richtig!";
      fb.style.color = "#22c55e";
    } else {
      fb.innerHTML = "❌ Noch nicht ganz.";
      fb.style.color = "#ef4444";
    }
  }

  function checkMC(buttonEl, isCorrect) {
    const parent = buttonEl.parentElement;
    const buttons = parent.querySelectorAll("button[data-mc]");
    buttons.forEach(btn => {
      btn.disabled = true;
      btn.style.cursor = "default";
      if (btn.dataset.mc === "correct") {
        btn.style.background = "rgba(34,197,94,0.25)";
        btn.style.borderColor = "#22c55e";
        btn.style.color = "#22c55e";
      } else {
        btn.style.background = "rgba(239,68,68,0.15)";
        btn.style.borderColor = "#30363d";
        btn.style.color = "#8b949e";
      }
    });
    const fb = parent.querySelector("[data-mc-feedback]");
    if (fb) {
      fb.innerHTML = isCorrect ? "✅ Richtig!" : "❌ Leider falsch – die richtige Antwort ist grün markiert.";
      fb.style.color = isCorrect ? "#22c55e" : "#ef4444";
    }
  }

  function revealStep(elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.style.display = (el.style.display === "block") ? "none" : "block";
  }

  function randomizeRiemann(prefix) {
    const a = (Math.random() * 0.4 + 0.1).toFixed(2);
    const b = (Math.random() * 2 - 1).toFixed(2);
    const c = (Math.random() * 2).toFixed(2);
    const funcStr = `${a}*x*x + ${b}*x + ${c}`;
    const bEnd = 4 + Math.floor(Math.random() * 3);
    const n = 3 + Math.floor(Math.random() * 3);
    const type = Math.random() < 0.5 ? "U" : "O";

    const svg = document.getElementById(prefix + "-canvas");
    if (svg) { svg.dataset.func = funcStr; svg.dataset.b = bEnd; }

    riemann(prefix + "-canvas", 0, bEnd, n, type);

    const taskEl = document.getElementById(prefix + "-task");
    if (taskEl) {
      const typeLabel = type === "U" ? "Untersumme" : "Obersumme";
      taskEl.innerHTML = `Berechne die ${typeLabel} \\(${type}_${n}\\) für \\(f(x) = ${funcStr.replace(/\*/g, "")}\\) auf \\([0; ${bEnd}]\\).`;
    }
    const solEl = document.getElementById(prefix + "-solution");
    if (solEl) solEl.style.display = "none";
  }

  // ==================================================
  // 7) SORTIER-AUFGABE
  // ==================================================
  function swapStep(el) {
    const parent = el.parentElement;
    if (!parent.dataset.selected) {
      parent.querySelectorAll('[data-step]').forEach(e => e.style.outline = 'none');
      el.style.outline = '2px solid #00dfc8';
      parent.dataset.selected = el.dataset.step;
    } else {
      const firstId = parent.dataset.selected;
      const first = parent.querySelector(`[data-step="${firstId}"]`);
      if (first && first !== el) {
        const tempHTML = first.innerHTML;
        const tempStep = first.dataset.step;
        first.innerHTML = el.innerHTML;
        first.dataset.step = el.dataset.step;
        el.innerHTML = tempHTML;
        el.dataset.step = tempStep;
      }
      parent.querySelectorAll('[data-step]').forEach(e => e.style.outline = 'none');
      delete parent.dataset.selected;
    }
  }

  function checkOrder(containerId, correctOrder, feedbackId) {
    const container = document.getElementById(containerId);
    const fb = document.getElementById(feedbackId);
    if (!container || !fb) return;
    const items = [...container.querySelectorAll('[data-step]')];
    const current = items.map(el => el.dataset.step).join('');
    if (current === correctOrder) {
      fb.innerHTML = "✅ Perfekte Reihenfolge!";
      fb.style.color = "#22c55e";
    } else {
      fb.innerHTML = "❌ Noch nicht ganz. Überlege, was zuerst gemacht werden muss.";
      fb.style.color = "#ef4444";
    }
  }

  // ==================================================
  // 8) 3D-WÜRFEL
  // ==================================================
  const cube3dState = { dragging: false, lastX: 0, lastY: 0, rotX: -20, rotY: 30 };

  function initCube3d(sceneId) {
    const scene = document.getElementById(sceneId);
    if (!scene) return;
    cube3dState.rotX = -20;
    cube3dState.rotY = 30;
    updateCube3d(sceneId);

    const start = (e) => {
      cube3dState.dragging = true;
      const p = e.touches ? e.touches[0] : e;
      cube3dState.lastX = p.clientX;
      cube3dState.lastY = p.clientY;
      if (e.cancelable) e.preventDefault();
    };
    const move = (e) => {
      if (!cube3dState.dragging) return;
      const p = e.touches ? e.touches[0] : e;
      cube3dState.rotY += (p.clientX - cube3dState.lastX) * 0.6;
      cube3dState.rotX -= (p.clientY - cube3dState.lastY) * 0.6;
      cube3dState.lastX = p.clientX;
      cube3dState.lastY = p.clientY;
      updateCube3d(sceneId);
    };
    const end = () => { cube3dState.dragging = false; };

    scene.addEventListener('mousedown', start);
    scene.addEventListener('touchstart', start, { passive: false });
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }

  function updateCube3d(sceneId) {
    const inner = document.getElementById(sceneId + '-inner');
    if (!inner) return;
    inner.style.transform = `rotateX(${cube3dState.rotX}deg) rotateY(${cube3dState.rotY}deg)`;
  }

  function rollCube(sceneId) {
    cube3dState.rotX += 360 + Math.random() * 180;
    cube3dState.rotY += 360 + Math.random() * 180;
    const inner = document.getElementById(sceneId + '-inner');
    if (inner) {
      inner.style.transition = 'transform 1s ease-out';
      updateCube3d(sceneId);
      setTimeout(() => { inner.style.transition = 'transform 0.05s linear'; }, 1000);
    }
  }

  // ==================================================
  // 9) AUTO-INIT FÜR DYNAMISCHE ELEMENTE
  // ==================================================
  function initAllDynamic() {
    // Riemann-Canvas (Slider) initialisieren
    const gw = document.getElementById('gw-canvas');
    if (gw && !gw.dataset.done) {
      gw.dataset.done = '1';
      riemann('gw-canvas', 0, 5, 4, 'U');
    }
    // MovePoint-Canvas initialisieren
    const mp = document.getElementById('mp-canvas');
    if (mp && !mp.dataset.done) {
      mp.dataset.done = '1';
      movePoint('mp-canvas', 2, null, 'mp-info');
    }
    // 3D-Würfel initialisieren
    const cube = document.getElementById('wuerfel');
    if (cube && !cube.dataset.done) {
      cube.dataset.done = '1';
      initCube3d('wuerfel');
    }
  }

  // ==================================================
  // 10) START
  // ==================================================
  loadCardsFromURL()
    .then(data => {
      allCards = data;
      if (!allCards || allCards.length === 0) {
        document.getElementById('card-content').innerHTML =
          '<div class="error-box">Der Kartensatz ist leer.</div>';
        return;
      }
      loadBlock(0);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('card-content').innerHTML =
        '<div class="error-box"><b>Fehler beim Laden:</b><br>' + err.message + '</div>';
      document.getElementById('card-counter').innerText = 'Fehler';
    });
</script>

</body>
