<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Schreck Lernkarten-Trainer</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="initApp();"></script>

  <style>
    body {
      background-color: #000000;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app-container {
      background-color: #0d1117;
      border-left: 5px solid #644533;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
      width: 100%;
      max-width: 850px;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .counter {
      font-size: 1rem;
      color: #8b949e;
      font-family: monospace;
    }
    .card-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      min-height: 240px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    .card-content {
      font-size: 1.6rem;
      line-height: 1.6;
      color: #e5e7eb;
    }
    .card-content.answer-mode {
      color: #00dfc8;
    }
    .cloze {
      background-color: #21262d;
      color: #00dfc8;
      padding: 2px 8px;
      border-radius: 4px;
      border-bottom: 2px solid #00dfc8;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      gap: 15px;
    }
    button.action-btn {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 14px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      flex: 1;
    }
    button.action-btn.primary {
      background: #238636;
      color: #ffffff;
      border: none;
    }
    button.action-btn:hover {
      opacity: 0.9;
    }
    .shuffle-container {
      text-align: center;
      margin-top: 20px;
    }
    button.shuffle-btn {
      background: transparent;
      border: none;
      color: #00dfc8;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <span id="card-counter" class="counter">Lade Deck...</span>
  </div>
  
  <div id="card-box" class="card-box" onclick="flipCard()">
    <div id="card-content" class="card-content">Lade Karten...</div>
  </div>
  
  <div class="btn-row">
    <button class="action-btn" onclick="prevCard()">← Zurück</button> 
    <button class="action-btn primary" onclick="flipCard()">Umdrehen</button>
    <button class="action-btn" onclick="nextCard()">Weiter →</button>
  </div>
  
  <div class="shuffle-container">
    <button class="shuffle-btn" onclick="shuffleCards()">Kartensatz mischen (Zufallsprinzip)</button>
  </div>
</div>

<script>
  // Zentrale Kartensätze direkt im Code hinterlegt – blitzschnell, absolut fehlerfrei und ohne externe Server-Zicken!
  const allDecks = {
    "Q3.1": [
      { front: "Was ist ein Zufallsexperiment?", back: "Ein Vorgang, der beliebig oft unter gleichen Bedingungen wiederholt werden kann und dessen Ausgang nicht mit Sicherheit vorhersehbar ist." },
      { front: "Was versteht man unter der Ergebnismenge \\(\\Omega\\)?", back: "Die Menge aller möglichen Ausgänge eines Zufallsexperiments. Beispiel Würfel: \\(\\Omega = \\{1, 2, 3, 4, 5, 6\\}\\)." },
      { front: "Was ist der Unterschied zwischen Ergebnis und Ereignis?", back: "Ein <b>Ergebnis</b> \\(\\omega\\) ist ein einzelnes Element der Ergebnismenge (\\(\\omega \\in \\Omega\\)). Ein <b>Ereignis</b> \\(E\\) ist eine Teilmenge der Ergebnismenge (\\(E \\subseteq \\Omega\\))." },
      { front: "Wann spricht man von einem Laplace-Experiment?", back: "Wenn alle Elementarergebnisse der Ergebnismenge \\(\\Omega\\) exakt dieselbe Wahrscheinlichkeit besitzen." },
      { front: "Wie lautet die Laplace-Formel zur Wahrscheinlichkeitsberechnung?", back: "\\(P(E) = \\frac{|E|}{|\\Omega|} = \\frac{\\text{Anzahl der für } E \\text{ günstigen Ergebnisse}}{\\text{Anzahl aller möglichen Ergebnisse}}\\)" },
      { front: "Was ist ein unmögliches Ereignis und wie groß ist seine Wahrscheinlichkeit?", back: "Ein Ereignis, das kein Element aus \\(\\Omega\\) enthält (\\(E = \\emptyset\\)). Seine Wahrscheinlichkeit beträgt immer \\(P(E) = 0\\)." },
      { front: "Was ist ein sicheres Ereignis und wie groß ist seine Wahrscheinlichkeit?", back: "Ein Ereignis, das alle Elemente aus \\(\\Omega\\) umfasst (\\(E = \\Omega\\)). Seine Wahrscheinlichkeit beträgt immer \\(P(E) = 1\\)." },
      { front: "Was ist das Gegenereignis \\(\\bar{E}\\) und wie berechnet man seine Wahrscheinlichkeit?", back: "Das Gegenereignis enthält alle Ausgänge aus \\(\\Omega\\), die nicht zu \\(E\\) gehören (\\(\\bar{E} = \\Omega \\setminus E\\)). Es gilt: \\(P(\\bar{E}) = 1 - P(E)\\)." },
      { front: "Wie lautet die Summenregel für die Wahrscheinlichkeiten von Ereignis und Gegenereignis?", back: "\\(P(E) + P(\\bar{E}) = 1\\) (bzw. \\(100\\%\\))." },
      { front: "In welchem Intervall liegt der Wert einer Wahrscheinlichkeit \\(P(A)\\) immer?", back: "Für jedes Ereignis \\(A\\) gilt: \\(0 \\le P(A) \\le 1\\)." },
      { front: "Ein Vorgang, der unter gleichen Bedingungen wiederholt werden kann und dessen Ausgang nicht vorhersehbar ist, heißt {{c1::Zufallsexperiment}}.", back: "Ein Vorgang, der unter gleichen Bedingungen wiederholt werden kann und dessen Ausgang nicht vorhersehbar ist, heißt {{c1::Zufallsexperiment}}." },
      { front: "Die Menge aller möglichen Elementarergebnisse wird mit dem Symbol {{c1::\\(\\Omega\\)}} bezeichnet.", back: "Die Menge aller möglichen Elementarergebnisse wird mit dem Symbol {{c1::\\(\\Omega\\)}} bezeichnet." },
      { front: "Ein Ereignis \\(E\\) ist mathematisch definiert als {{c1::Teilmenge}} der Ergebnismenge \\(\\Omega\\).", back: "Ein Ereignis \\(E\\) ist mathematisch definiert als {{c1::Teilmenge}} der Ergebnismenge \\(\\Omega\\)." },
      { front: "Bei einem Laplace-Experiment berechnet man die Wahrscheinlichkeit durch den Bruch: Anzahl der {{c1::günstigen}} Ausgänge geteilt durch die Anzahl der {{c2::möglichen}} Ausgänge.", back: "Bei einem Laplace-Experiment berechnet man die Wahrscheinlichkeit durch den Bruch: Anzahl der {{c1::günstigen}} Ausgänge geteilt durch die Anzahl der {{c2::möglichen}} Ausgänge." },
      { front: "Das sichere Ereignis umfasst die gesamte Menge {{c1::\\(\\Omega\\)}}, während das unmögliche Ereignis die {{c2::leere Menge \\(\\emptyset\\)}} ist.", back: "Das sichere Ereignis umfasst die gesamte Menge {{c1::\\(\\Omega\\)}}, während das unmögliche Ereignis die {{c2::leere Menge \\(\\emptyset\\)}} ist." }
    ]
  };

  let cards = [];
  let currentIndex = 0;
  let showingFront = true;

  function initApp() {
    const urlParams = new URLSearchParams(window.location.search);
    const deckKey = urlParams.get('deck') || 'Q3.1';
    
    if (allDecks[deckKey]) {
      cards = allDecks[deckKey];
      shuffleCards();
    } else {
      document.getElementById('card-content').innerText = "Fehler: Kartensatz '" + deckKey + "' wurde nicht gefunden.";
    }
  }

  function processText(text, isFront) {
    if (!text) return "";
    return text.replace(/\{\{c\d+::(.*?)\}\}/g, function(match, p1) {
      if (isFront) {
        return `<span class="cloze">[...]</span>`;
      } else {
        return `<span class="cloze">${p1}</span>`;
      }
    });
  }

  function displayCard() {
    if (cards.length === 0) return;
    const card = cards[currentIndex];

    const contentDiv = document.getElementById('card-content');
    const counterDiv = document.getElementById('card-counter');

    if (showingFront) {
      contentDiv.innerHTML = processText(card.front, true);
      contentDiv.classList.remove('answer-mode');
    } else {
      contentDiv.innerHTML = processText(card.back, false);
      contentDiv.classList.add('answer-mode');
    }

    counterDiv.innerText = `Karte ${currentIndex + 1} / ${cards.length}`;

    if (window.renderMathInElement) {
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    }
  }

  function flipCard() {
    showingFront = !showingFront;
    displayCard();
  }

  function nextCard() {
    showingFront = true;
    currentIndex = (currentIndex + 1) % cards.length;
    displayCard();
  }

  function prevCard() {
    showingFront = true;
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    displayCard();
  }

  function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    currentIndex = 0;
    showingFront = true;
    displayCard();
  }
</script>

</body>
</html>
