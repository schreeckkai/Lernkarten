<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe-Schreck Lernkarten-Trainer</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="initApp();"></script>

  <style>
    body {
      background-color: #000000; /* Tiefschwarz im 3b1b-Stil */
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app-container {
      background-color: #0d1117;
      border-left: 5px solid #644533; /* Deine Wunschfarbe am linken Rand */
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
      width: 100%;
      max-width: 850px;
      box-sizing: border-box;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .counter {
      font-size: 1rem;
      color: #8b949e;
      font-family: monospace;
    }
    .card-box {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      min-height: 240px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    .card-content {
      font-size: 1.6rem; /* Groß und lesbar wie der Fragentext */
      line-height: 1.6;
      color: #e5e7eb; /* 3b1b Standard-Textfarbe für Fragen */
    }
    .card-content.answer-mode {
      color: #00dfc8; /* 3b1b Cyan für Antworten */
    }
    .cloze {
      background-color: #21262d;
      color: #00dfc8;
      padding: 2px 8px;
      border-radius: 4px;
      border-bottom: 2px solid #00dfc8;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      gap: 15px;
    }
    button.action-btn {
      background: #21262d;
      color: #e5e7eb;
      border: 1px solid #30363d;
      padding: 14px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      flex: 1;
    }
    button.action-btn.primary {
      background: #238636;
      color: #ffffff;
      border: none;
    }
    button.action-btn:hover {
      opacity: 0.9;
    }
    .shuffle-container {
      text-align: center;
      margin-top: 20px;
    }
    button.shuffle-btn {
      background: transparent;
      border: none;
      color: #00dfc8;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <span id="card-counter" class="counter">Lade Deck...</span>
  </div>
  
  <div id="card-box" class="card-box" onclick="flipCard()">
    <div id="card-content" class="card-content">Lade Karten...</div>
  </div>
  
  <div class="btn-row">
    <button class="action-btn" onclick="prevCard()">← Zurück</button> 
    <button class="action-btn primary" onclick="flipCard()">Umdrehen</button>
    <button class="action-btn" onclick="nextCard()">Weiter →</button>
  </div>
  
  <div class="shuffle-container">
    <button class="shuffle-btn" onclick="shuffleCards()">Kartensatz mischen (Zufallsprinzip)</button>
  </div>
</div>

<script>
  let cards = [];
  let currentIndex = 0;
  let showingFront = true;

  async function initApp() {
    const urlParams = new URLSearchParams(window.location.search);
    const deckFolder = urlParams.get('deck') || 'Q3.1';
    
    // Absolute URL direkt auf GitHub Pages, damit der Pfad immer greift (egal von wo aufgerufen)
    const jsonUrl = `https://schreeckkai.github.io/Lernkarten/${deckFolder}/karten.json`;

    try {
      const response = await fetch(jsonUrl);
      if (!response.ok) throw new Error("Netzwerkfehler");
      cards = await response.json();

      if (cards.length > 0) {
        shuffleCards();
      } else {
        document.getElementById('card-content').innerText = "Keine Karten im Deck gefunden.";
      }
    } catch (e) {
      document.getElementById('card-content').innerText = "Fehler: Konnte Kartendatei nicht laden.";
    }
  }

  function processText(text, isFront) {
    if (!text) return "";
    return text.replace(/\{\{c\d+::(.*?)\}\}/g, function(match, p1) {
      if (isFront) {
        return `<span class="cloze">[...]</span>`;
      } else {
        return `<span class="cloze">${p1}</span>`;
      }
    });
  }

  function displayCard() {
    if (cards.length === 0) return;
    const card = cards[currentIndex];

    const contentDiv = document.getElementById('card-content');
    const counterDiv = document.getElementById('card-counter');

    if (showingFront) {
      contentDiv.innerHTML = processText(card.front, true);
      contentDiv.classList.remove('answer-mode');
    } else {
      contentDiv.innerHTML = processText(card.back, false);
      contentDiv.classList.add('answer-mode');
    }

    counterDiv.innerText = `Karte ${currentIndex + 1} / ${cards.length}`;

    if (window.renderMathInElement) {
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ]
      });
    }
  }

  function flipCard() {
    showingFront = !showingFront;
    displayCard();
  }

  function nextCard() {
    showingFront = true;
    currentIndex = (currentIndex + 1) % cards.length;
    displayCard();
  }

  function prevCard() {
    showingFront = true;
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    displayCard();
  }

  function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    currentIndex = 0;
    showingFront = true;
    displayCard();
  }
</script>

</body>
</html>
